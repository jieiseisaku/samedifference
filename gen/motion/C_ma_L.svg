<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<style>
.track { animation: track 6s ease-in-out infinite; }
@keyframes track { 0%, 100% { letter-spacing: 0em; } 50% { letter-spacing: 0.09em; } }
.dot { animation: dotShift 6s ease-in-out infinite; }
@keyframes dotShift { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(84px); } }
</style>
<rect width="1920" height="1080" fill="#fff"/>
<g class="grp"><text x="900" y="540" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="620" fill="#000" class="track">MON</text><text x="1462" y="540" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="620" fill="#000" class="dot">.</text></g>
</svg>
