</style>
<rect width="1920" height="1080" fill="#000"/>
<g class="grp"><text x="350" y="540" text-anchor="middle" dominant-baseline="central" font-family="'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-weight="300" font-size="1150" fill="#fff" class="">(</text><text x="960" y="540" text-anchor="middle" dominant-baseline="central" font-family="'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-weight="300" font-size="700" fill="#fff" class="">月</text><text x="1570" y="540" text-anchor="middle" dominant-baseline="central" font-family="'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-weight="300" font-size="1150" fill="#fff" class="">)</text></g>
</svg>
