<g class="grp"><text x="900" y="540" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="620" fill="#000" class="">MON</text><text x="1462" y="540" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="620" fill="#000" class="">.</text></g>
</svg>
