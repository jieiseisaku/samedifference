<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>same difference — R</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .panel { position: relative; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
  .panel video, .panel canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain; display: block;
    opacity: 0; z-index: 1;
  }
  .panel video.show, .panel canvas.show { opacity: 1; }
  /* 交代先を先に前面へ重ね、1フレーム後に元を消す。両方が消えた瞬間を作らない */
  .panel video.top { z-index: 2; }
  #genLayer { z-index: 3; }
  #wait {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    color: #444; font-family: sans-serif; font-size: 14px; z-index: 9;
  }
</style>
</head>
<body>
<div class="panel">
  <video class="layer" playsinline muted preload="auto"></video>
  <video class="layer" playsinline muted preload="auto"></video>
  <video class="layer" playsinline muted preload="auto"></video>
  <video class="layer" playsinline muted preload="auto"></video>
  <canvas id="genLayer" width="1920" height="1080"></canvas>
</div>
<div id="wait">コントロール画面の待機中…</div>

<script src="debug/sd_debug.js"></script>
<script>
/* =========================================================
   R 表示ページ

   control から {cur, next} を cue で受け取って読み込み、go で指定された
   壁時計の時刻ちょうどに出す。cur/next は 動画番号（数値）か
   gen クリップID（文字列 "G_01"）。

   設計の要点（安定性優先）:
   - ループは動画自身の loop に任せる（control のプレビューと同じ最も単純な形）。
     表示中の動画は常に loop = true なので、何が起きても回り続ける。
   - GAPLESS_LOOP を true にすると、ループの継ぎ目を消すために相方の要素と
     交代する仕組みが乗る。既定は false。安定性を最優先し、継ぎ目が気になる
     場合だけ有効にする。交代は末尾 LOOP_LEAD 秒の窓の中でしか成立させず、
     窓を過ぎた交代は必ず捨てる（遅れて出すと「再生直後にまた頭出し」になる）。
   - 交代は相方が実際に動き出したことを確認してから、前面に重ねて行う。
     重ねてから元を消すので、両方が消えた瞬間（黒）ができない。
   - 250ms ごとの見張り（heal）が「表示が1枚あって、それが再生中で、
     いまの項目と一致している」ことを常に確認し、崩れていれば直す。
     requestAnimationFrame が止まる全画面切り替え中でも動くよう、
     見張りは setInterval とイベントの両方から動かす。
   - 読み込めていないレイヤーは決して表に出さない（黒を出さない）。
   - 動画は fetch で丸ごと取得してから video に渡す。src に URL を直接
     入れると、読み込み途中から再生が始まる経路が残るため。

   音声はこの画面では一切鳴らさない（常時ミュート）。
   ========================================================= */
const SIDE = 'R';
const PAD = 2;
const VIDEO_DIR = 'assets/video/';

const GAPLESS_LOOP = false;   // true: 相方と交代してループの継ぎ目を消す
                              /* 既定は false（動画自身の loop だけで回す）。
                                 プレビューと同じ最も単純な経路になり、
                                 交代にまつわる不具合が起きようがない。 */
const LOOP_LEAD   = 0.08;     // 相方を先行スタートする余裕（秒）。固定。
                              /* ここを大きくすると、その秒数だけ末尾が切り捨てられて
                                 「早く頭出しされた」ように見えるため、伸ばさない。 */
const SWAP_TIMEOUT  = 150;    // 交代をあきらめるまで（ms）。遅れた交代は必ず捨てる。
const HEAL_MS       = 250;    // 見張りの間隔（ms）
const BUFFER_WAIT   = 30000;  // 読み込みを待つ上限（ms）

/* =========================================================
   動画の取得（fetch で丸ごと取ってから video に渡す）

   src に URL を直接入れるとブラウザの判断で読み込み途中から再生が始まり、
   読み切れていない状態で表に出ることがある。ここで一度 blob として
   丸ごと受け取り、手元にある動画だけを video 要素へ割り当てる。
   保持は「いま出している分」と「先読み分」だけで、それ以外は捨てる。
   ========================================================= */
const clipBlobs = new Map();      // 番号 -> blob URL（取得済み）
const clipFetch = new Map();      // 番号 -> 取得中の Promise

function clipURL(i){ return clipBlobs.get(String(i)) || null; }
function fetchClip(i){
  const k = String(i);
  if (clipBlobs.has(k)) return Promise.resolve(clipBlobs.get(k));
  if (clipFetch.has(k)) return clipFetch.get(k);
  const t0 = Date.now();
  const p = fetch(src(i))
    .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(b => {
      const u = URL.createObjectURL(b);
      clipBlobs.set(k, u); clipFetch.delete(k);
      const ms = Date.now() - t0;
      if (window.SDDBG) SDDBG.ev('取得', { item: SIDE+'_'+num(i), MB: +(b.size/1048576).toFixed(1), ms },
                                 ms > 20000 ? '!' : (ms > 10000 ? '?' : '.'));
      return u;
    })
    .catch(e => {
      clipFetch.delete(k);
      console.warn('動画の取得に失敗:', src(i), e);
      if (window.SDDBG) SDDBG.ev('取得失敗', { item: SIDE+'_'+num(i), 理由: String(e && e.message || e) }, '!');
      return null;
    });
  clipFetch.set(k, p);
  return p;
}
/* keep に無い動画を捨てる。表に出ていないレイヤーが握っていれば先に外す。 */
function trimClips(keep){
  const k = new Set((keep || []).filter(v => v !== null && v !== undefined && !isGen(v)).map(String));
  layers.forEach(v => { if (v.classList.contains('show') && v.dataset.num) k.add(v.dataset.num); });
  [...clipBlobs.keys()].forEach((n)=>{
    if (k.has(n)) return;
    layers.forEach((v)=>{
      if (v.dataset.num !== n || v.classList.contains('show')) return;
      try{ v.pause(); }catch(e){}
      v.removeAttribute('src'); v.dataset.num = ''; try{ v.load(); }catch(e){}
    });
    URL.revokeObjectURL(clipBlobs.get(n));
    clipBlobs.delete(n);
  });
}

const layers = document.querySelectorAll('.layer');
const genCanvas = document.getElementById('genLayer');
const genCtx = genCanvas.getContext('2d');
const waitEl = document.getElementById('wait');

let vA = 0, vB = 1, vP = 2, vS = 3;  // layers 内の役割
let shownNum = -1;      // いま出している項目
let targetNum = -1;     // 切り替え中の目標項目
let gen = 0;            // 最新指示のみ有効にする世代番号
let genClipId = null;   // canvas に描画中の gen クリップID
let swapping = false;   // ループ交代の実行中
let switching = false;  // 項目の切替中（出しかけの絵を見張りに消させない）
let switchDeadline = 0; // 切替の期限（これを過ぎたら見張りを再開する）
let swapDeadline = 0;   // 交代の期限（これを過ぎたら失敗とみなす）

function num(n){ return String(n).padStart(PAD, '0'); }
function src(i){ return `${VIDEO_DIR}${SIDE}_${num(i)}.mp4`; }
function isGen(v){ return typeof v === 'string'; }

/* 動画をレイヤーに割り当てる。常に loop = true（安全網）
   取得できていない動画は割り当てず、取得を始めて false を返す。 */
function setLayer(layer, i){
  const u = clipURL(i);
  if (!u){ fetchClip(i); return false; }
  if (layer.dataset.num === String(i) && layer.src === u){ layer.loop = true; return true; }
  layer.loop = true;
  layer.muted = true;
  layer.preload = 'auto';
  layer.dataset.num = String(i);
  layer.src = u;
  layer.load();
  return true;
}
function playSafe(v){ v.muted = true; const p = v.play(); if (p && p.catch) p.catch(()=>{}); }
/* 表に出ていないレイヤーだけ、止めて先頭に戻す。
   表示中のレイヤーには絶対に触らない（触ると再生中に頭出しされてしまう）。 */
function parkHidden(v){
  if (v.classList.contains('show')) return false;
  try{ v.pause(); v.currentTime = 0; }catch(e){}
  return true;
}
/* 表に出さないまま一度だけ再生してデコーダを温め、0秒に戻して止めておく */
function primeLayer(v){
  const t0 = Date.now();
  const wait = ()=>{
    if (v.classList.contains('show')) return;     // 表に出たら温める必要はない
    if (v.readyState >= 3){
      const p = v.play();
      const settle = ()=> parkHidden(v);
      if (p && p.then) p.then(()=> setTimeout(settle, 60)).catch(()=>{});
      else setTimeout(settle, 60);
      return;
    }
    if (Date.now() - t0 < 10000) setTimeout(wait, 100);
  };
  wait();
}
function hideAllExcept(keep){
  layers.forEach((v)=>{ if (v !== keep){ v.classList.remove('show'); v.classList.remove('top'); } });
}

/* ---- gen スクリプトの動的読込（control から受け取ったリスト） ---- */
const genLoaded = {};
function loadGenScripts(files){
  (files || []).forEach((f)=>{
    if (genLoaded[f]) return;
    genLoaded[f] = true;
    const s = document.createElement('script');
    s.src = 'gen/' + f;
    document.head.appendChild(s);
  });
}

/* ---- gen 描画ループ（常駐） ---- */
(function genLoop(){
  if (genClipId){
    const clip = (window.GEN_CLIPS || {})[genClipId];
    if (clip) clip.draw(genCtx, genCanvas.width, genCanvas.height, SIDE);
  }
  requestAnimationFrame(genLoop);
})();

/* =========================================================
   ギャップレスなループ交代（うまくいけば継ぎ目が消える上乗せ）
   ========================================================= */

/* 実際に1フレーム描かれた瞬間を拾う。
   requestVideoFrameCallback は不透明度0のレイヤーで呼ばれないことがあるので、
   currentTime の監視と競争させ、先に成立したほうを採る。 */
function onFirstFrame(v, cb){
  let done = false;
  const fire = ()=>{ if (done) return; done = true; cb(); };
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(()=> fire());
  const t0 = performance.now();
  const watch = ()=>{
    if (done) return;
    if (v.currentTime > 0 && v.readyState >= 2) fire();
    else if (performance.now() - t0 > SWAP_TIMEOUT) fire();
    else requestAnimationFrame(watch);
  };
  requestAnimationFrame(watch);
}

let swapToken = 0;
function tryLoopSwap(){
  const a = layers[vA], b = layers[vB];
  if (!a.duration || a.paused || a.ended) return;
  if (a.duration - a.currentTime > LOOP_LEAD) return;
  if (b === a) return;
  if (b.dataset.num !== String(shownNum) || b.readyState < 3) return;  // 相方が未準備 → 標準ループに任せる

  swapping = true;
  swapDeadline = performance.now() + SWAP_TIMEOUT + 100;
  const myGen = gen, myToken = ++swapToken;
  const aStart = a.currentTime;              // 交代を仕掛けた時点の再生位置
  let settled = false;

  const giveUp = ()=>{                       // 交代せず、元の動画をそのまま続ける
    if (settled) return; settled = true;
    parkHidden(b);                           // 表に出ていなければ止めて戻す
    swapping = false;
  };

  try{ b.currentTime = 0; }catch(e){}
  const p = b.play();
  if (p && p.catch) p.catch(()=> giveUp());

  onFirstFrame(b, ()=>{
    if (settled) return;
    if (myToken !== swapToken || myGen !== gen){ giveUp(); return; }
    if (b.readyState < 2 || b.currentTime <= 0){ giveUp(); return; }   // 出せる状態でなければ交代しない
    /* 遅れて届いた交代は必ず捨てる。
       表示中の動画がすでに標準ループで先頭へ戻っていたら（現在位置が仕掛けた
       時点より手前）、ここで相方を出すと「再生直後にまた頭出し」になる。
       末尾に達していない場合も同様に捨てて、そのまま最後まで再生させる。 */
    if (a.currentTime < aStart || a.duration - a.currentTime > LOOP_LEAD + 0.06){ giveUp(); return; }
    settled = true;
    b.classList.add('top');                  // 前面に重ねる（この時点で切れ目は無い）
    b.classList.add('show');
    requestAnimationFrame(()=>{
      if (myToken !== swapToken || myGen !== gen){ swapping = false; return; }
      a.classList.remove('show');            // 1フレーム重ねたので元を消す
      a.classList.remove('top');
      try{ a.pause(); }catch(e){}
      requestAnimationFrame(()=>{
        try{ a.currentTime = 0; }catch(e){}
        a.loop = true;
      });
      const t = vA; vA = vB; vB = t;
      swapping = false;
    });
  });
  setTimeout(giveUp, SWAP_TIMEOUT);
}

(function loopTick(){
  requestAnimationFrame(loopTick);
  if (!GAPLESS_LOOP) return;
  if (genClipId || shownNum === -1 || isGen(shownNum)) return;
  if (swapping){
    if (performance.now() > swapDeadline) swapping = false;   // 期限切れは失敗として解除
    return;
  }
  tryLoopSwap();
})();

/* =========================================================
   見張り（heal）
   「表示が1枚あって、再生中で、いまの項目と一致している」ことを保つ。
   崩れていれば直す。読み込めていないレイヤーは表に出さない。
   ========================================================= */
function heal(){
  if (switching){                         // 切替の最中は触らない
    if (performance.now() < switchDeadline) return;
    switching = false;                    // 期限切れは失敗として解除
  }
  if (swapping){
    if (performance.now() < swapDeadline) return;
    swapping = false;                       // 全画面切り替え等で交代が固まった場合
  }
  if (shownNum === -1) return;

  if (isGen(shownNum)){
    if (!genCanvas.classList.contains('show')){
      genCanvas.classList.add('show');
      hideAllExcept(null);
    }
    return;
  }

  const v = layers[vA];
  const ok = v.classList.contains('show')
          && v.dataset.num === String(shownNum)
          && v.readyState >= 2 && !v.paused && !v.ended;
  if (ok){
    // 余分に表示が残っていれば片付ける（交代や切替の取りこぼし）
    if ([...layers].filter(x => x.classList.contains('show')).length > 1) hideAllExcept(v);
    if (genCanvas.classList.contains('show')) genCanvas.classList.remove('show');
    return;
  }

  if (v.dataset.num !== String(shownNum) || !v.src) setLayer(v, shownNum);
  v.loop = true;
  if (v.ended || (v.duration && v.currentTime >= v.duration - 0.05)){
    try{ v.currentTime = 0; }catch(e){}
  }
  if (v.paused || v.ended) playSafe(v);

  if (v.readyState >= 2){                   // フレームが用意できてから入れ替える（黒を出さない）
    v.classList.add('show');
    hideAllExcept(v);
    genCanvas.classList.remove('show');
    genClipId = null;
    waitEl.style.display = 'none';
  } else if (![...layers].some(x => x.classList.contains('show')) && !genCanvas.classList.contains('show')){
    // 何も出ていない：出せるレイヤーがあれば暫定で出す
    const alt = [...layers].find(x => x.readyState >= 2 && x.dataset.num === String(shownNum));
    if (alt){ alt.classList.add('show'); hideAllExcept(alt); playSafe(alt); }
  }
}
setInterval(()=> heal(), HEAL_MS);
layers.forEach((v)=>{
  v.addEventListener('ended', ()=>{ if (v.classList.contains('show')) heal(); });
  v.addEventListener('pause', ()=>{ if (v.classList.contains('show')) setTimeout(()=> heal(), 0); });
});
document.addEventListener('fullscreenchange', ()=>{ swapping = false; heal(); });
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) heal(); });

/* =========================================================
   項目の読み込みと表示
   ========================================================= */

/* 次項目の先読み。vid のみ対象（gen は即出せる） */
function preload(next){
  if (isGen(next) || next === null || next === undefined) return;
  fetchClip(next).then((u)=>{
    if (u && layers[vP] !== layers[vA]) setLayer(layers[vP], next);
  });
}

/* cue された項目を「すぐ出せる」状態まで用意する。
   末尾まで読み込み、先頭フレームを実際に描かせてから止めておく。 */
function prepare(item){
  return new Promise((resolve)=>{
    if (isGen(item)){
      const wait = ()=> ((window.GEN_CLIPS || {})[item] ? resolve() : setTimeout(wait, 100));
      wait();
      return;
    }
    const v = layers[vP];
    const t0 = Date.now();
    let done = false;
    const finish = ()=>{ if (done) return; done = true; resolve(); };

    function primeFirstFrame(){            // デコーダを温めて 0 秒に置く
      let primed = false;
      const settle = ()=>{
        if (primed) return; primed = true;
        if (v.classList.contains('show')){ finish(); return; }  // 既に表に出ていたら触らない
        try{ v.pause(); }catch(e){}
        if (v.currentTime !== 0){
          v.addEventListener('seeked', finish, { once: true });
          try{ v.currentTime = 0; }catch(e){ finish(); }
          setTimeout(finish, 500);
        } else finish();
      };
      const p = v.play();
      if (p && p.catch) p.catch(()=> settle());
      if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(()=> settle());
      setTimeout(settle, 1500);
    }
    function fullyBuffered(){
      if (!v.duration || !isFinite(v.duration) || !v.buffered.length) return false;
      return v.buffered.end(v.buffered.length - 1) >= v.duration - 0.15;
    }
    const poll = ()=>{
      if (done) return;
      const el = Date.now() - t0;
      if (fullyBuffered() && v.readyState >= 4){ primeFirstFrame(); return; }
      if (el > BUFFER_WAIT && v.readyState >= 2){ primeFirstFrame(); return; }
      setTimeout(poll, 50);
    };
    v.addEventListener('error', finish, { once: true });
    setTimeout(finish, BUFFER_WAIT + 4000);
    fetchClip(item).then((u)=>{
      if (done) return;
      if (!u){ finish(); return; }        // 取得できなければ ready を返し、見張りに任せる
      setLayer(v, item);
      poll();
    });
  });
}

/* 指定項目を表示する。空いたレイヤーへ next を先読みする。 */
function show(cur, next){
  waitEl.style.display = 'none';
  if (cur === shownNum || cur === targetNum){ preload(next); return; }

  const myGen = ++gen;
  swapping = false;                          // 進行中の交代は無効化
  switching = true;                          // ここから切替。完了まで見張りを止める
  switchDeadline = performance.now() + 1500;
  targetNum = cur;

  /* ---- gen を表示 ---- */
  if (isGen(cur)){
    const tryShow = ()=>{
      if (myGen !== gen) return;
      const clip = (window.GEN_CLIPS || {})[cur];
      if (!clip){ setTimeout(tryShow, 100); return; }
      genClipId = cur;
      clip.draw(genCtx, genCanvas.width, genCanvas.height, SIDE);   // 1フレーム目を描いてから見せる
      genCanvas.classList.add('show');
      requestAnimationFrame(()=> requestAnimationFrame(()=>{
        if (myGen !== gen) return;
        layers.forEach((v)=>{ v.classList.remove('show'); v.classList.remove('top'); try{ v.pause(); }catch(e){} });
        shownNum = cur;
        preload(next);
        switching = false;
      }));
    };
    tryShow();
    return;
  }

  /* ---- 動画を表示 ---- */
  const showV = layers[vP];
  if (!setLayer(showV, cur)){
    fetchClip(cur).then(()=>{ if (myGen === gen) setLayer(showV, cur); });
  }

  const reveal = ()=>{
    if (myGen !== gen) return;
    if (showV.readyState < 2){ setTimeout(reveal, 50); return; }   // フレームが無いうちは出さない
    playSafe(showV);
    showV.classList.add('top');              // 前面に重ねてから表示する
    showV.classList.add('show');
    const oldA = vA, oldB = vB;
    vA = vP; vB = vS; vP = oldA; vS = oldB;  // 役割はここで確定させる（後続の停止で崩れない）
    shownNum = cur;
    if (GAPLESS_LOOP){
      setLayer(layers[vB], cur);             // ループ相方に同じ動画を用意
      primeLayer(layers[vB]);                // 最初のループから交代できるよう温めておく
    }
    genClipId = null;
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      if (myGen !== gen) return;
      [oldA, oldB].forEach((i)=>{
        layers[i].classList.remove('show');
        layers[i].classList.remove('top');
        try{ layers[i].pause(); }catch(e){}
      });
      genCanvas.classList.remove('show');
      requestAnimationFrame(()=>{
        [oldA, oldB].forEach((i)=>{ try{ layers[i].currentTime = 0; }catch(e){} layers[i].loop = true; });
      });
      preload(next);
      trimClips([cur, next]);
      switching = false;
    }));
  };

  if (showV.readyState >= 2) reveal();
  else {
    let done = false;
    const once = ()=>{ if (done) return; done = true; reveal(); };
    showV.addEventListener('loadeddata', once, { once: true });
    showV.addEventListener('error', once, { once: true });
    setTimeout(once, 3000);
  }
}

/* =========================================================
   control とのやり取り
   ========================================================= */
const ch = new BroadcastChannel('same_difference');

let cued = null;        // {token, cur, next}
let lastCueAt = 0;

/* go で指定された壁時計の時刻ちょうどに出す。
   L / R は同じマシンの Date.now() を見るので、左右のズレが出ない。 */
const _mc = new MessageChannel();
let _spinQ = [];
_mc.port1.onmessage = ()=>{ const q = _spinQ; _spinQ = []; q.forEach(f => f()); };
function tickSoon(fn){ _spinQ.push(fn); _mc.port2.postMessage(0); }

function fireAt(at, run){
  const step = ()=>{
    const d = at - Date.now();
    if (d <= 0){ run(); return; }
    if (d > 40) setTimeout(step, d - 30);
    else tickSoon(step);
  };
  step();
}

ch.onmessage = (e)=>{
  const m = e.data || {};
  if (m.genFiles) loadGenScripts(m.genFiles);

  if (m.type === 'ping'){
    ch.postMessage({ type:'hello', side: SIDE });
  }

  if (m.type === 'cue'){
    const c = { token:m.token, cur:m[SIDE+'cur'], next:m[SIDE+'next'] };
    cued = c; lastCueAt = Date.now();
    trimClips([shownNum, c.cur, c.next]);
    if (shownNum === -1) waitEl.textContent = '読み込み中…';
    prepare(c.cur).then(()=>{
      if (cued !== c) return;
      if (shownNum === -1) waitEl.textContent = '準備完了　コントロール画面で開始してください';
      ch.postMessage({ type:'ready', side:SIDE, token:c.token });
    });
  }

  if (m.type === 'go'){
    const c = cued;
    if (!c || c.token !== m.token) return;
    fireAt(m.at, ()=>{ if (cued === c) show(c.cur, c.next); });
  }

  if (m.type === 'sync'){
    // 取りこぼし復帰用。cue の直後は go を待っている最中なので触らない。
    if (m[SIDE+'cur'] !== shownNum && Date.now() - lastCueAt > 3000){
      cued = null;
      show(m[SIDE+'cur'], m[SIDE+'next']);
    }
  }
};

ch.postMessage({ type:'hello', side: SIDE });
setInterval(()=>{ if (shownNum === -1) ch.postMessage({ type:'hello', side: SIDE }); }, 2000);

document.addEventListener('click', ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
});
document.addEventListener('keydown', (e)=>{
  if(e.key.toLowerCase() === 'f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});
/* =========================================================
   デバッグ計測（?debug=1 のときだけ動く）

   ここは表示だけを見張る。既定では何もしない。
   見ているもの:
     黒（表示が1枚も無い瞬間）／実際の絵が真っ黒／絵が固まっている
     再生位置が進まない／勝手に頭出しされた／勝手に止まった
     media 要素のエラー・待ち／読み込みにかかった時間
     go の指定時刻からの遅れ／表示が出るまでの時間
     見張り（heal）が直しに入った回数と、その前後の状態
   ========================================================= */
if (window.SDDBG && SDDBG.on){
  const D = SDDBG;
  const dlabel = (v)=> (v === -1 || v === undefined) ? '-' : (isGen(v) ? v : (SIDE+'_'+num(v)));

  const dvisible = ()=>{
    const vs = [...layers].filter(x => x.classList.contains('show'));
    if (genCanvas.classList.contains('show')) return { el: genCanvas, n: vs.length + 1, gen: true };
    const hit = vs.find(x => x.dataset.num === String(shownNum));   // 切替の重なり中は今の項目を優先
    return { el: hit || vs[0] || null, n: vs.length, gen: false };
  };
  const dsnap = ()=> [...layers].map(v =>
      (v.classList.contains('show') ? 'S' : '-') + (v.paused ? 'p' : 'r') + (v.dataset.num || '?')
    ).join(',') + (genCanvas.classList.contains('show') ? '|G' : '|-');

  D.state = ()=>{
    const v = dvisible();
    return dlabel(shownNum) + ',' + v.n + (v.el && !v.gen ? ','+v.el.currentTime.toFixed(2) : '');
  };

  /* ---- 表示が1枚も無い時間・2枚以上重なっている時間を測る ---- */
  let blackFrom = 0, overFrom = 0;
  const mo = new MutationObserver(()=>{
    if (shownNum === -1) return;
    const n = dvisible().n;
    const now = performance.now();
    if (n === 0){ if (!blackFrom) blackFrom = now; }
    else if (blackFrom){
      const ms = now - blackFrom; blackFrom = 0;
      if (ms > 20) D.ev('黒', { item: dlabel(shownNum), ms }, ms > 100 ? '!' : '?');
    }
    if (n > 1){ if (!overFrom) overFrom = now; }
    else if (overFrom){
      const ms = now - overFrom; overFrom = 0;
      if (ms > 400) D.ev('重なり', { item: dlabel(shownNum), ms }, ms > 1000 ? '!' : '?');
    }
  });
  [...layers, genCanvas].forEach(el => mo.observe(el, { attributes:true, attributeFilter:['class'] }));

  /* ---- 実際に描かれている絵を見る（真っ黒・固まり） ---- */
  const probe = document.createElement('canvas');
  probe.width = 32; probe.height = 18;
  const pctx = probe.getContext('2d', { willReadFrequently: true });
  let lastCt = -1, stallFrom = 0, sameSig = -1, sameCount = 0, blackCount = 0, badFrom = 0, lastEl = null;
  let reported = {};                       // 項目ごとに1回だけ報告する
  let lastItem = null;

  setInterval(()=>{
    if (shownNum === -1) return;
    const now = performance.now();
    const item = dlabel(shownNum);
    if (item !== lastItem){ lastItem = item; reported = {}; sameCount = 0; blackCount = 0; sameSig = -1; lastCt = -1; stallFrom = 0; }
    const vis = dvisible();
    if (vis.n !== 1){                      // 表示が0枚または2枚以上のまま戻らない場合の保険
      if (!badFrom) badFrom = now;
      else if (now - badFrom > 3000 && !reported.badN){ reported.badN = 1; D.ev('表示数', { item, n: vis.n, ms: now - badFrom }, '!'); }
    } else badFrom = 0;
    if (!vis.el) return;                   // 黒は MutationObserver 側で記録済み
    if (vis.el !== lastEl){ lastEl = vis.el; lastCt = -1; stallFrom = 0; sameSig = -1; sameCount = 0; }

    if (!vis.gen){
      const v = vis.el;
      if (v.paused && !reported.paused){ reported.paused = 1; D.ev('止まった', { item, ct: v.currentTime, ready: v.readyState }, '!'); }
      if (lastCt >= 0){
        if (v.currentTime < lastCt - 0.05){
          const wrapped = v.duration && lastCt > v.duration - 1.2;
          if (!wrapped) D.ev('巻き戻り', { item, from: lastCt, to: v.currentTime, dur: v.duration }, '!');
        } else if (v.currentTime === lastCt && !v.paused){
          if (!stallFrom) stallFrom = now;
          else if (now - stallFrom > 900){
            D.ev('進まない', { item, ct: v.currentTime, ms: now - stallFrom, ready: v.readyState, net: v.networkState }, '!');
            stallFrom = now;
          }
        } else stallFrom = 0;
      }
      lastCt = v.currentTime;
    }

    try{
      pctx.drawImage(vis.el, 0, 0, 32, 18);
      const d = pctx.getImageData(0, 0, 32, 18).data;
      let sum = 0, mx = 0;
      for (let i = 0; i < d.length; i += 4){
        const y = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
        sum += y; if (y > mx) mx = y;
      }
      if (mx < 8){
        if (++blackCount === 3 && !reported.black){ reported.black = 1; D.ev('真っ黒', { item, 平均: sum/(32*18) }, '!'); }
      } else blackCount = 0;
      const sig = Math.round(sum);
      if (!vis.gen){                       // gen は1秒に1回しか絵が変わらないので対象外
        if (sig === sameSig){
          if (++sameCount === 4 && !reported.frozen){ reported.frozen = 1; D.ev('絵が固まる', { item, ct: vis.el.currentTime }, '?'); }
        } else sameCount = 0;
      }
      sameSig = sig;
    }catch(e){}
  }, 500);

  /* ---- media 要素の異常 ---- */
  ['stalled','waiting','error','abort','emptied'].forEach((t)=>{
    layers.forEach((v, i)=>{
      v.addEventListener(t, ()=>{
        const shown = v.classList.contains('show');
        D.ev('media', { e:t, layer:i, 表示: shown ? 1 : 0, item: v.dataset.num, ready: v.readyState, err: v.error ? v.error.code : '' },
             (t === 'error') ? '!' : (shown ? '?' : '.'));
      });
    });
  });

  /* ---- 見張りが直しに入ったら残す ---- */
  const _heal = heal;
  heal = function(){
    const a = dsnap();
    _heal();
    const b = dsnap();
    if (a !== b) D.ev('直した', { item: dlabel(shownNum), 前: a, 後: b }, '?');
  };

  /* ---- 読み込みにかかった時間 ---- */
  const _prepare = prepare;
  prepare = function(item){
    const t0 = performance.now();
    return _prepare(item).then((r)=>{
      const ms = performance.now() - t0;
      D.ev('読み込み', { item: dlabel(item), ms }, ms > 5000 ? '!' : (ms > 2000 ? '?' : '.'));
      return r;
    });
  };

  /* ---- go の時刻からの遅れ ---- */
  const _fireAt = fireAt;
  fireAt = function(at, run){
    _fireAt(at, ()=>{
      const late = Date.now() - at;
      D.ev('go', { 遅れms: late }, Math.abs(late) > 30 ? '?' : '.');
      run();
    });
  };

  /* ---- 表示が実際に出るまで ---- */
  const _show = show;
  show = function(cur, next){
    const t0 = Date.now();
    const from = dlabel(shownNum);
    _show(cur, next);
    let tries = 0;
    const watch = ()=>{
      if (shownNum === cur){
        const el = isGen(cur) ? null : layers[vA];
        const done = ()=>{
          const ms = Date.now() - t0;
          D.ev('表示', { item: dlabel(cur), 前: from, ms }, ms > 400 ? '?' : '.');
        };
        if (el && el.requestVideoFrameCallback) el.requestVideoFrameCallback(()=> done());
        else done();
        return;
      }
      if (tries++ < 250) setTimeout(watch, 20);
      else D.ev('表示できず', { item: dlabel(cur), ms: Date.now() - t0 }, '!');
    };
    watch();
  };

  /* ---- control からの点呼に答える（左右のズレの実測用） ---- */
  if (D.bus) D.bus.addEventListener('message', (e)=>{
    const m = e.data || {};
    if (m.type !== 'probe') return;
    const v = (shownNum === -1 || isGen(shownNum)) ? null : layers[vA];
    D.bus.postMessage({
      type:'probeR', id:m.id, side:SIDE, t:Date.now(),
      item: shownNum, ct: v ? v.currentTime : -1, dur: v ? (v.duration || 0) : 0,
      paused: v ? (v.paused ? 1 : 0) : 1, ready: v ? v.readyState : -1, n: dvisible().n
    });
  });

  /* ---- 1分ごとの生存記録 ---- */
  setInterval(()=>{
    const v = dvisible();
    D.ev('60秒', { item: dlabel(shownNum), 表示数: v.n, ct: (v.el && !v.gen) ? v.el.currentTime : -1,
                   全画面: document.fullscreenElement ? 1 : 0 });
  }, 60000);
}
